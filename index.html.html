/* ===================== AUDIO ===================== */
let AC=null;
function beep(f,d,type,vol){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), gg=AC.createGain();
    o.type=type||'square'; o.frequency.value=f; gg.gain.value=vol||0.05;
    o.connect(gg); gg.connect(AC.destination); o.start();
    gg.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+d); o.stop(AC.currentTime+d);
  }catch(e){}
}
function jingle(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'square',0.06),i*90)); }
function fanfare(){
  const seq=[[784,.13],[784,.13],[784,.13],[622,.34],[698,.13],[784,.13],[0,.1],[698,.13],[784,.42],
             [1046,.16],[988,.16],[880,.16],[784,.16],[1046,.7]];
  let t=0;
  seq.forEach(a=>{ const dt=t; if(a[0]) setTimeout(()=>beep(a[0],a[1],'square',0.055), dt*1000); t+=a[1]; });
  setTimeout(()=>{ [392,523,659].forEach((f,i)=>setTimeout(()=>beep(f,0.8,'triangle',0.04), i*40)); }, 2200);
}
function noise(f,d){ beep(f,d,'sawtooth',0.05); }

/* ===================== DRAW HELPERS ===================== */
function px(x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),w,h); }
function disc(cx,cy,r,c){ for(let y=-r;y<=r;y++){ const w=Math.floor(Math.sqrt(r*r-y*y)); px(cx-w,cy+y,w*2+1,1,c);} }
function hash(x,y){ let n=x*374761393+y*668265263; n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967295; }

function mkPat(c1,c2){
  const p=document.createElement('canvas'); p.width=2; p.height=2;
  const q=p.getContext('2d');
  q.fillStyle=c1; q.fillRect(0,0,2,2);
  q.fillStyle=c2; q.fillRect(0,0,1,1); q.fillRect(1,1,1,1);
  return g.createPattern(p,'repeat');
}
const PAT={};
function initPat(){
  PAT.water=mkPat(C.water,C.waterM); PAT.waterD=mkPat(C.waterM,C.waterD);
  PAT.shal=mkPat(C.shal,C.shalM);
  PAT.grass=mkPat(C.grass,C.grassM);
  PAT.gravel=mkPat(C.gravel,C.gravelM);
  PAT.rock=mkPat(C.rock,C.rockM);
  PAT.cliff=mkPat(C.cliff,C.cliffM);
  PAT.leaf=mkPat(C.leaf,C.leafM);
  PAT.roof=mkPat(C.roof,C.roofM);
  PAT.road=mkPat(C.road,C.roadM);
  PAT.wall=mkPat(C.wall,C.wallM);
}
function pat(k,x,y,w,h){ if(!PAT[k]) initPat(); g.fillStyle=PAT[k]; g.fillRect(Math.round(x),Math.round(y),w,h); }
/* ふちどり つきの いし */
function rock(x,y,w,h,wet){
  px(x-1,y,1,h,C.out); px(x+w,y,1,h,C.out); px(x,y-1,w,1,C.out); px(x,y+h,w,1,C.out);
  px(x,y,w,h,C.rock); px(x,y,w,1,C.rockL); px(x,y+h-1,w,1,C.rockM);
  if(wet) px(x-1,y+h,w+2,1,C.foam);
}
function pebble(x,y,w,h,c){ px(x,y,w,h,c); }

function drawTile(ch,sx,sy,tx,ty){
  const r=hash(tx,ty);

  if(ch==='M'){ /* たいがんの もり・やま */
    px(sx,sy,16,16,C.cliffM);
    pat('cliff',sx,sy+3,16,13);
    px(sx,sy,16,3,C.cliffL);
    for(let i=0;i<3;i++){ const bx=sx+i*6-1, by=sy+5+((hash(tx*3+i,ty)*4)|0);
      px(bx+1,by,5,1,C.cliffD); px(bx,by+1,7,3,C.cliffD); }
    px(sx,sy+15,16,1,C.out);
    return;
  }

  if(ch==='W'||ch==='k'||ch==='K'||ch==='w'){
    const sh=(ch==='w');
    px(sx,sy,16,16, sh?C.shal:C.water);
    pat(sh?'shal':'water',sx,sy,16,16);
    if(!sh && ty<=3) pat('waterD',sx,sy,16,8);
    if(sh){ /* かわぞこの いし */
      for(let i=0;i<4;i++){ const h1=hash(tx*31+i*5, ty*37+i*3);
        pebble(sx+((h1*13)|0), sy+2+((hash(ty+i,tx+i)*12)|0), 2, 1, h1<0.5?'#8fb6a6':'#b6cfb8'); }
    }
    /* ながれる なみ */
    const ph=(((tick>>3)+tx*3+ty*5)%4)*4;
    px(sx+ph,     sy+3, 5,1, sh?C.shalL:C.waterL);
    px(sx+(ph+8)%16, sy+10, 4,1, sh?C.shalL:C.waterL);
    /* いわ */
    for(let i=0;i<2;i++){
      const h1=hash(tx*11+i*7, ty*13+i*3);
      if(h1<0.40){ const rx=2+((hash(tx+i*5,ty*2)*8)|0), ry=3+((hash(ty+i*5,tx*2)*8)|0);
        rock(sx+rx, sy+ry, 3+((h1*20)|0)%3, 2+((h1*13)|0)%2, true); }
    }
    if(ch==='k'){ rock(sx+2,sy+4,12,8,true); px(sx+4,sy+5,7,2,C.rockL); px(sx+5,sy+9,5,1,C.rockD); }
    if(ch==='K'){ rock(sx+1,sy+2,14,11,true); px(sx+3,sy+3,10,3,C.rockL); px(sx+4,sy+10,8,1,C.rockD); }
    return;
  }

  if(ch==='G'||ch==='X'||ch==='g'){
    px(sx,sy,16,16,C.gravel);
    pat('gravel',sx,sy,16,16);
    const up=tileAt(tx,ty-1), lf=tileAt(tx-1,ty);
    if(up==='W'||up==='w'){ px(sx,sy,16,1,C.foam); px(sx,sy+1,16,1,C.gravelL); }
    if(lf==='W'||lf==='w'){ px(sx,sy,1,16,C.foam); }
    for(let i=0;i<4;i++){
      const h1=hash(tx*17+i*3, ty*19+i*7);
      pebble(sx+((hash(tx+i,ty*3)*13)|0), sy+2+((hash(ty+i,tx*3)*12)|0),
        2+((h1*11)|0)%2, 1, h1<0.4?C.gravelD:C.gravelL);
    }
    if(r<0.30) rock(sx+4,sy+7,6,4,false);
    if(ch==='g'){ rock(sx+1,sy+3,13,10,false); px(sx+3,sy+4,8,3,C.rockL); px(sx+4,sy+10,7,2,C.rockD); }
    if(ch==='X'){
      px(sx+4,sy+4,8,1,C.out); px(sx+3,sy+5,1,10,C.out); px(sx+12,sy+5,1,10,C.out); px(sx+4,sy+15,8,1,C.out);
      px(sx+4,sy+5,8,10,C.leafM);
      px(sx+5,sy+5,2,10,C.leafD); px(sx+9,sy+5,2,10,C.leafD);
      px(sx+4,sy+6,1,3,C.leafL); px(sx+7,sy+6,1,2,C.leafL);
      if(got['suika']){ px(sx+4,sy+5,8,4,'#e2544f'); px(sx+4,sy+5,8,1,'#f6f0dc');
        px(sx+6,sy+7,1,1,'#2a2a2a'); px(sx+9,sy+6,1,1,'#2a2a2a'); }
    }
    return;
  }

  if(ch==='A'||ch==='V'){
    px(sx,sy,16,16,C.road);
    pat('road',sx,sy,16,16);
    if(ty===20){ if(tx%2===0) px(sx+3,sy+7,10,2,'#e8e2c8'); }
    else if(ty>=21 && tx%3===1) px(sx,sy,1,16,'#d6d2b8');
    const u=tileAt(tx,ty-1);
    if(u!=='A'&&u!=='V') px(sx,sy,16,1,C.roadL);
    if(ch==='V'){
      const cc=['#c2483f','#3f6fb0','#e4e0d2','#3f8f5a'][(hash(tx,ty)*4)|0];
      px(sx+2,sy,12,16,C.out);
      px(sx+3,sy+1,10,14,cc);
      px(sx+4,sy+2,8,3,C.pane); px(sx+4,sy+11,8,3,C.pane);
      px(sx+4,sy+2,8,1,C.paneL);
      px(sx+3,sy+6,10,3,cc==='#e4e0d2'?'#c0bcae':'#ffffff');
      px(sx+1,sy+3,2,3,C.out); px(sx+13,sy+3,2,3,C.out);
      px(sx+1,sy+11,2,3,C.out); px(sx+13,sy+11,2,3,C.out);
    }
    return;
  }

  /* ---------- くさち ---------- */
  px(sx,sy,16,16,C.grass);
  if(r<0.34){ px(sx+3,sy+5,2,1,C.grassD); px(sx+2,sy+6,4,1,C.grassD);
              px(sx+10,sy+11,2,1,C.grassD); px(sx+9,sy+12,4,1,C.grassD); }
  else if(r<0.46){ px(sx+6,sy+6,3,1,C.flower); px(sx+7,sy+5,1,1,C.grassL); px(sx+7,sy+7,1,1,C.grassD); }
  else if(r<0.62){ px(sx+11,sy+3,4,1,C.grassL); px(sx+2,sy+12,4,1,C.grassL); }

  if(ch==='T'){
    px(sx+4,sy,8,1,C.out); px(sx+2,sy+1,2,1,C.out); px(sx+12,sy+1,2,1,C.out);
    px(sx+1,sy+2,1,7,C.out); px(sx+14,sy+2,1,7,C.out);
    px(sx+2,sy+9,1,1,C.out); px(sx+13,sy+9,1,1,C.out);
    px(sx+3,sy+10,10,1,C.out);
    px(sx+4,sy+1,8,9,C.leaf); px(sx+2,sy+2,12,7,C.leaf);
    pat('leaf',sx+2,sy+5,12,5);
    px(sx+4,sy+9,8,1,C.leafD); px(sx+3,sy+8,10,1,C.leafD);
    px(sx+4,sy+2,4,1,C.leafL); px(sx+3,sy+3,3,1,C.leafL); px(sx+8,sy+2,2,1,C.leafL);
    px(sx+5,sy+11,6,5,C.out); px(sx+6,sy+11,4,5,C.trunkD); px(sx+7,sy+11,2,5,C.trunk);
  }

  /* ---------- バンガロー ---------- */
  if(ch==='1'){ const li=localX('1',tx,ty);
    px(sx,sy+1,16,1,C.out);
    px(sx,sy+2,16,14,C.roof);
    pat('roof',sx,sy+7,16,7);
    px(sx,sy+2,16,2,C.roofL);
    px(sx,sy+6,16,1,C.roofD); px(sx,sy+10,16,1,C.roofD);
    px(sx,sy+14,16,2,C.roofD);
    if(li===0){ px(sx,sy+2,1,14,C.out); px(sx-1,sy+14,2,2,C.out); }
    if(li===3){ px(sx+15,sy+2,1,14,C.out); px(sx+15,sy+14,2,2,C.out); }
    if(li===1){ px(sx+9,sy+2,3,3,C.roofL); }
  }
  if(ch==='2'){ const li=localX('2',tx,ty);
    px(sx,sy,16,16,C.wall); pat('wall',sx,sy+4,16,6);
    px(sx,sy+3,16,1,C.wallD); px(sx,sy+9,16,1,C.wallD);
    if(li===1||li===2){
      px(sx+2,sy,12,1,C.out); px(sx+2,sy+1,12,8,C.frame);
      px(sx+3,sy+2,10,6,C.pane); px(sx+3,sy+2,10,1,C.paneL);
      px(sx+7,sy+2,1,6,C.frame); px(sx+3,sy+5,10,1,C.frame);
    }
    px(sx,sy+10,16,1,C.out); px(sx,sy+11,16,5,'#b48856');
    for(let i=0;i<5;i++) px(sx+1+i*3,sy+11,1,5,'#7f5c34');
    px(sx,sy+11,16,1,'#d0a86e'); px(sx,sy+15,16,1,C.out);
    if(li===0) px(sx,sy,1,11,C.out);
    if(li===3) px(sx+15,sy,1,11,C.out);
  }
  if(ch==='3'){ const li=localX('3',tx,ty);
    px(sx,sy,16,15,C.wall); pat('wall',sx,sy,16,7);
    px(sx,sy+4,16,1,C.wallD); px(sx,sy+9,16,1,C.wallD);
    if(li===0) px(sx+1,sy,3,15,'#a97f52');
    if(li===1){ px(sx+3,sy+2,10,13,C.out); px(sx+4,sy+3,8,12,C.frame);
      px(sx+5,sy+4,6,10,'#96694a'); px(sx+10,sy+8,1,2,'#f0d060');
      px(sx+2,sy+13,12,2,'#b8b2a2'); px(sx+2,sy+14,12,1,C.out); }
    if(li===2){ px(sx+2,sy+3,12,1,C.out); px(sx+2,sy+4,12,6,C.frame);
      px(sx+3,sy+5,10,4,C.pane); px(sx+3,sy+5,10,1,C.paneL); px(sx+7,sy+5,1,4,C.frame); }
    if(li===3){ px(sx+3,sy+3,9,1,C.out); px(sx+3,sy+4,9,5,C.frame);
      px(sx+4,sy+5,7,3,C.pane); px(sx+4,sy+5,7,1,C.paneL); px(sx+15,sy,1,15,C.out); }
    px(sx,sy+15,16,1,C.out);
  }

  /* ---------- うけつけ ---------- */
  if(ch==='c'){ const li=localX('c',tx,ty);
    px(sx,sy+3,16,1,C.out); px(sx,sy+4,16,12,'#4f6f7c');
    px(sx,sy+4,16,2,'#7ea0ae'); px(sx,sy+13,16,3,'#33505c');
    if(li===0){ px(sx,sy+4,1,12,C.out); px(sx-1,sy+13,2,3,C.out); }
    if(li===2){ px(sx+15,sy+4,1,12,C.out); px(sx+15,sy+13,2,3,C.out); }
  }
  if(ch==='C'){ const li=localX('C',tx,ty);
    px(sx,sy,16,15,C.wall); pat('wall',sx,sy+6,16,6);
    px(sx,sy+5,16,1,C.wallD);
    if(li===1){ px(sx+3,sy+2,10,13,C.out); px(sx+4,sy+3,8,12,C.frame);
      px(sx+3,sy,10,3,'#c2483f'); px(sx+4,sy,2,3,'#f2ead2'); px(sx+8,sy,2,3,'#f2ead2'); }
    if(li===0){ px(sx+3,sy+3,8,1,C.out); px(sx+3,sy+4,8,5,C.frame); px(sx+4,sy+5,6,3,C.pane); px(sx+4,sy+5,6,1,C.paneL); px(sx,sy,1,15,C.out); }
    if(li===2){ px(sx+5,sy+3,8,1,C.out); px(sx+5,sy+4,8,5,C.frame); px(sx+6,sy+5,6,3,C.pane); px(sx+6,sy+5,6,1,C.paneL); px(sx+15,sy,1,15,C.out); }
    px(sx,sy+15,16,1,C.out);
  }

  /* ---------- こもの ---------- */
  if(ch==='Q'){
    px(sx,sy+3,16,1,C.out); px(sx,sy+4,16,8,'#54545e'); px(sx,sy+4,16,2,'#767682');
    px(sx,sy+11,16,1,C.out);
    px(sx+2,sy+12,2,4,'#3a3a42'); px(sx+12,sy+12,2,4,'#3a3a42');
    for(let i=0;i<4;i++) px(sx+2+i*4,sy+6,2,4,'#2a2a31');
    if(timeIdx===2){ const f=(tick>>3)%2;
      px(sx+3,sy+5,4,2,'#8f4c2b'); px(sx+9,sy+5,4,2,'#8f4c2b');
      px(sx+4,sy+1+f,3,4,'#ff9a3c'); px(sx+9,sy+2-f,3,3,'#ffd45e'); px(sx+6,sy+3,2,2,'#fff0b4'); }
    else { const s=(tick>>4)%2; px(sx+6,sy+1+s,2,3,'#cfd8cf'); }
  }
  if(ch==='B'){ const li=localX('B',tx,ty);
    px(sx,sy+4,16,1,C.out); px(sx,sy+5,16,6,'#cba46c'); px(sx,sy+5,16,1,'#e6c48f');
    px(sx,sy+11,16,1,C.out);
    px(sx+2,sy+12,2,4,'#8f6c3a'); px(sx+12,sy+12,2,4,'#8f6c3a');
    if(li===0){ px(sx+4,sy-1,3,7,C.out); px(sx+4,sy,3,5,'#2f6b3a'); px(sx+4,sy+2,3,2,'#e8e0c0'); }
    if(li===1){ px(sx+2,sy+1,5,4,'#f8f4e4'); px(sx+2,sy+1,5,1,C.out);
      px(sx+3,sy+2,3,1,'#8a8a80'); px(sx+3,sy+3,2,1,'#8a8a80');
      px(sx+10,sy+2,3,3,'#f2ead2'); px(sx+10,sy+2,3,1,C.out); }
  }
  if(ch==='N'){
    px(sx+1,sy+4,14,1,C.out); px(sx+1,sy+5,14,9,'#43434d'); px(sx+1,sy+5,14,2,'#66666f');
    px(sx+2,sy+7,12,4,'#6d4b23'); px(sx+2,sy+7,12,1,'#8f6832');
    px(sx+3,sy+7,3,3,'#4a3a26'); px(sx+8,sy+8,3,2,'#4a3a26');
    px(sx,sy+13,16,2,'#26262c'); px(sx,sy+15,16,1,C.out);
    const st=(tick>>4)%3; px(sx+4,sy+1+st,1,3,'#dfe8df'); px(sx+10,sy+2-st,1,3,'#dfe8df');
  }
  if(ch==='P'){ /* はりがみ */
    px(sx+3,sy+9,2,7,C.trunkD); px(sx+11,sy+9,2,7,C.trunkD);
    px(sx+1,sy,14,1,C.out); px(sx+1,sy+1,14,9,'#8a6a44');
    px(sx+2,sy+2,12,7,'#f8f4e4');
    px(sx+3,sy+3,10,1,'#6a6a60'); px(sx+3,sy+5,8,1,'#96968c');
    px(sx+3,sy+7,9,1,'#96968c');
    px(sx+2,sy+2,2,1,'#c2483f'); px(sx+12,sy+2,2,1,'#c2483f');
    px(sx+1,sy+10,14,1,C.out);
  }
}

const _spc={};
function compose(key,map,ov){
  if(_spc[key]) return _spc[key];
  const rows=map.map(r=>r.split(''));
  if(ov) ov.forEach(o=>{ for(let j=0;j<o[3];j++) for(let i=0;i<o[2];i++){
    const rr=o[0]+j, cc=o[1]+i;
    if(rr>=0&&rr<16&&cc>=0&&cc<16) rows[rr][cc]=o[4]; } });
  return _spc[key]=rows;
}
function drawRows(rows,x,y,col,flip,small){
  const rr = small ? rows.filter((v,i)=>i!==2&&i!==12) : rows;
  const oy = small ? 2 : 0;
  for(let r=0;r<rr.length;r++){
    const row=rr[r], yy=y+r+oy;
    let c=0;
    while(c<16){
      const ch=flip?row[15-c]:row[c];
      if(ch==='.'){ c++; continue; }
      let n=1;
      while(c+n<16 && (flip?row[15-(c+n)]:row[c+n])===ch) n++;
      const cc=col[ch];
      if(cc) px(x+c,yy,n,1,cc);
      c+=n;
    }
  }
}

  const spots=[];
  for(let y=2;y<=9;y++) for(let x=0;x<MW;x++) if(isWater(x,y)) spots.push({x:x,y:y,sh:tileAt(x,y)==='w'});
  if(!spots.length) return;
  for(let i=0;i<20;i++){
    const s=spots[(hash(i*13+1,i*7+5)*spots.length)|0];
    fish.push({x:s.x*T+8, by:s.y*T+9, sh:s.sh, vx:(i%2?1:-1)*(0.25+hash(i,3)*0.25),
      ph:hash(i,11)*6, jump:0});
  }
}
function updateFish(){
  const inW=(tileAt(player.tx,player.ty)==='w');
  fish.forEach(f=>{
    f.ph+=0.18;
    if(f.jump>0){ f.jump--; return; }
    const ty=(f.by/T)|0;
    if(!isWater(((f.x+f.vx*12)/T)|0, ty)) f.vx*=-1;
    f.x+=f.vx;
    if(inW){
      const dx=f.x-(player.x+8), dy=f.by-(player.y+8);
      if(Math.abs(dx)<30 && Math.abs(dy)<22){
        f.vx=(dx>=0?1:-1)*0.9;
        if(!isWater(((f.x+f.vx*12)/T)|0, ty)) f.vx*=-1;
      }
    }
    if(Math.abs(f.vx)>0.55 && !inW) f.vx*=0.96;
    if(Math.random()<0.0007) { f.jump=26; beep(900,0.05,'sine',0.03); }
  });
}

function box(x,y,w,h){
  const b=Math.max(2,Math.round(S*0.8)), i=Math.max(1,Math.round(S*0.4));
  ctx.fillStyle=UI.dark; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=UI.light; ctx.fillRect(x+b,y+b,w-2*b,h-2*b);
  const o=b+Math.max(1,Math.round(S*0.8));
  ctx.fillStyle=UI.dark;
  ctx.fillRect(x+o,y+o,w-2*o,i); ctx.fillRect(x+o,y+h-o-i,w-2*o,i);
  ctx.fillRect(x+o,y+o,i,h-2*o); ctx.fillRect(x+w-o-i,y+o,i,h-2*o);
  ctx.fillStyle=UI.light;
  ctx.fillRect(x+o,y+o,i*3,i); ctx.fillRect(x+o,y+o,i,i*3);
  ctx.fillRect(x+w-o-i*3,y+h-o-i,i*3,i); ctx.fillRect(x+w-o-i,y+h-o-i*3,i,i*3);
}
function uiFont(sz){ ctx.font=Math.round(sz*S)+'px "DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans TC",monospace'; }
function wrap(text,maxW){
  const out=[]; let line='';
  for(const ch of text){
    if(ctx.measureText(line+ch).width>maxW && line){ out.push(line); line=ch; } else line+=ch;
  }
  if(line) out.push(line); return out;
}

function buildPages(){

  dlg.raw.forEach(t=>{ wrap(t,maxW).forEach(l=>all.push(l)); all.push(null); });

    cur.push(l); if(cur.length===3){ pages.push(cur); cur=[]; } });
  if(cur.length) pages.push(cur);
  dlg.pages=pages.length?pages:[['…']];

function tentacle(bx,by,ang,len,w0,t,ph,curl,front,react){
  const N=17, pts=[];

  ctx.beginPath();
  for(let i=0;i<=N;i++){ const p=pts[i], n=nrm(i);
    const X=p.x+n[0]*p.w, Y=p.y+n[1]*p.w;
    if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); }
  for(let i=N;i>=0;i--){ const p=pts[i], n=nrm(i);
    ctx.lineTo(p.x-n[0]*p.w, p.y-n[1]*p.w); }
  ctx.closePath();

  gd.addColorStop(0, front?'#2a2431':'#171320');
  gd.addColorStop(0.45, front?'#191524':'#100d18');
  gd.addColorStop(1,'#07060b');

  ctx.lineWidth=Math.max(1,S*0.75); ctx.lineJoin='round';
  ctx.beginPath();
  for(let i=0;i<=N;i++){ const p=pts[i], n=nrm(i);
    const sg=(n[0]-n[1])>0?1:-1;
    const X=p.x+n[0]*p.w*sg, Y=p.y+n[1]*p.w*sg;
    if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); }

  if(front){

      const p=pts[i], n=nrm(i);
      const sg=(n[0]-n[1])>0?-1:1;
      const rr=p.w*0.30;

      ctx.beginPath(); ctx.ellipse(p.x+n[0]*p.w*0.42*sg, p.y+n[1]*p.w*0.42*sg, rr, rr*0.78, Math.atan2(n[3],n[2]), 0, 6.284); ctx.fill();

    }
  }
  ctx.restore();
}

  if(bt.phase!=='cmd') return;
  if(dir==='up'){ bt.cur=(bt.cur+3)%4; beep(900,0.02); }
  if(dir==='down'){ bt.cur=(bt.cur+1)%4; beep(900,0.02); }
}
function btA(){
  if(bt.phase==='cmd'){ beep(700,0.05);
    bt.q=buildRound(bt.cur); bt.qi=0; bt.chars=0; bt.lines=null; bt.wait=0;
    bt.phase='resolve'; bt.round++; return; }
  const e=bt.q[bt.qi]; if(!e) return;
  if(!bt.lines) bt.lines=wrap(e.t, cv.width-Math.round(22*S));
  const total=bt.lines.join('').length;
  if(bt.chars<total){ bt.chars=total; return; }
  btAdvance();
}
function btTick(){
  if(bt.phase==='cmd') return;
  const e=bt.q[bt.qi]; if(!e) return;
  if(!bt.lines) bt.lines=wrap(e.t, cv.width-Math.round(22*S));
  const total=bt.lines.join('').length;
  if(bt.chars<total){ bt.sub++; if(bt.sub%3===0){ bt.chars++; if(bt.chars%4===0) beep(1300,0.01,'square',0.015); } }
  else { bt.wait++; if(bt.wait>110) btAdvance(); }
}

/* ===================== フィールド ロジック ===================== */
function npcAt(x,y){ return npcs.find(n=>n.x===x&&n.y===y); }
function blocked(x,y){ return SOLID.includes(tileAt(x,y)) || !!npcAt(x,y); }
function tryMove(dir){
  player.dir=dir;
  let dx=0,dy=0;
  if(dir==='up')dy=-1; if(dir==='down')dy=1; if(dir==='left')dx=-1; if(dir==='right')dx=1;
  if(blocked(player.tx+dx,player.ty+dy)){ player.step=(tick>>3)%2; return; }
  player.tx+=dx; player.ty+=dy; player.moving=true; player.mx=dx; player.my=dy; player.frame=0;
}
function updateMove(){
  if(!player.moving) return;
  player.x+=player.mx*2; player.y+=player.my*2; player.frame++;
  player.step=(player.frame>>2)%2;
  if(player.frame>=8){ player.moving=false; player.x=player.tx*T; player.y=player.ty*T; }
}
function facing(){
  let dx=0,dy=0;
  if(player.dir==='up')dy=-1; if(player.dir==='down')dy=1;
  if(player.dir==='left')dx=-1; if(player.dir==='right')dx=1;
  return {x:player.tx+dx, y:player.ty+dy};
}
function gainMemory(n){
  if(got[n.id]) return [];
  got[n.id]=true; flash=12; jingle();
  const cnt=Object.keys(got).length;
  const out=[TL(TX.getMem),'『'+TL(n.mem)+'』'];
  if(cnt===TOTAL){ out.push(TL(TX.allMem)); }
  else out.push(TL(TX.note)+'  '+cnt+'/'+TOTAL);
  return out;
}
function afterGain(){ if(Object.keys(got).length>=TOTAL && !ended){ ended=true; endT=0; mode='ending'; fanfare(); } }
function talk(n){
  if(NOTURN.indexOf(n.type)<0) n.dir={up:'down',down:'up',left:'right',right:'left'}[player.dir];
  const k=TIMES[timeIdx];
  let lines=(TL(n[k])||['…']).slice();
  if(n.id==='oyaji'){
    if(chronosWon){ say(lang==='ja'?['へんな おっちゃん「あれ？ わし なんか しゃべってたか？」','「……ぐびっ。」']
      :['怪怪大叔「咦？我剛剛說了什麼嗎？」','「……咕嚕。」']); return; }
    oyajiTalks++;
    if(oyajiTalks>=3){
      lines=lines.concat(lang==='ja'
        ?['……','おっちゃんの めが きらりと ひかった。','「じかんを むだに つかう やつは── わしが ゆるさん。」']
        :['……','大叔的眼睛閃了一下。','「浪費時間的人──我不會原諒。」']);
      say(lines, ()=>startBattle()); return;
    }
    say(lines); return;
  }
  if(n.mem && n.when===k && !got[n.id]){ lines=lines.concat(gainMemory(n)); say(lines, afterGain); return; }
  say(lines);
}
function interact(){
  const f=facing(), n=npcAt(f.x,f.y);
  if(n){ beep(660,0.05); talk(n); return; }
  const ch=tileAt(f.x,f.y);
  if(ch==='1'||ch==='2'||ch==='3'){
    beep(520,0.06);
    say(lang==='ja'
      ?['にかいだての バンガロー。おなじのが ごとう ならんでる。','にかいの テラスから かわが みえる。','すこし やすんでいこか。']
      :['兩層樓的小木屋。一樣的有五棟並排。','從二樓的露台可以看到河。','稍微休息一下吧。'], ()=>{
      timeIdx=(timeIdx+1)%3;
      say(lang==='ja'
        ?{0:['……あさ。かわのおとで めが さめた。','つめたい くうきが きもちええ。'],
          1:['……ひるまに なった。','ひざしで かわが キラキラしてる。'],
          2:['……ひが くれた。','むしのこえと ひの おとだけ。']}[timeIdx]
        :{0:['……早晨。被河水聲喚醒了。','冰涼的空氣很舒服。'],
          1:['……變成白天了。','陽光讓河面閃閃發亮。'],
          2:['……天黑了。','只有蟲鳴和火的聲音。']}[timeIdx]);
    });
    return;
  }
  if(ch==='X'){
    if(TIMES[timeIdx]==='day' && !got['suika']){ beep(300,0.12);
      say((lang==='ja'?['めかくしして ぼうを かまえる。','せーの…… メキャッ！！']
        :['蒙上眼睛拿起棍子。','一二…… 喀！！'])
        .concat(gainMemory(npcs.find(x=>x.id==='suika'))), afterGain);
    } else if(got['suika']) say(lang==='ja'?['われた すいか。あまくて つめたい。']:['破開的西瓜。又甜又冰。']);
    else say(lang==='ja'?['すいかは かわの みずで ひやしてある。','ひるまに わろ。']:['西瓜用河水冰著。','白天再來打吧。']);
    return;
  }
  if(ch==='N'){
    if(TIMES[timeIdx]==='morning' && !got['konnyaku']){ beep(400,0.1);
      say((lang==='ja'?['おおきな なべ。だしの においが する。','くしを いっぽん もらった。']
        :['一個大鍋子。飄著高湯的香味。','拿到了一串。'])
        .concat(gainMemory(npcs.find(x=>x.id==='konnyaku'))), afterGain);
    } else say(lang==='ja'?['おおきな なべ。こんにゃくが しみしみ。']:['大鍋子。蒟蒻超級入味。']);
    return;
  }
  if(ch==='P'){
    say(lang==='ja'
      ?['はりがみが はってある。','《 おもいで リスト 》',
        '・あさ … ホットケーキと コーヒーを もらう',
        '・あさ … かえりに しみしみこんにゃくを たべる',
        '・ひる … かわで およぐ',
        '・ひる … すいかを わる',
        '・よる … バーベキューを たべる',
        '・よる … せんこうはなびを する',
        'ぜんぶ そろえたら おもいでノートが かんせいや。',
        '※ じかんは バンガローで やすむと すすむ']
      :['貼著一張公告紙。','《 回憶清單 》',
        '・早上 … 拿到鬆餅和咖啡',
        '・早上 … 回程吃入味的蒟蒻',
        '・白天 … 在河裡游泳',
        '・白天 … 打西瓜',
        '・夜晚 … 吃烤肉',
        '・夜晚 … 玩仙女棒',
        '全部收集完成，回憶筆記就完成了。',
        '※ 在小木屋休息可以推進時間']);
    return;
  }
  if(ch==='B'){
    say(lang==='ja'
      ?['テーブル。いっしょうびんと かみコップ。','はしっこに かみきれが おいてある。',
        '『よっぱらいの おっちゃんに 3かい はなしかけたら ときのかみが でるで』','……だれかの いたずらがき やろか。']
      :['桌子。放著一升瓶和紙杯。','角落擺著一張小紙條。',
        '「向喝醉的大叔搭話三次，時間之神就會出現」','……大概是誰的惡作劇吧。']);
    return;
  }
  if(ch==='c'||ch==='C'){ say(lang==='ja'?['うけつけ。『コテージいずもと』','かぎと ゴミぶくろを もらった。','チェックアウトは 10じ やって。']
    :['接待處。「伊豆本小木屋」','拿到了鑰匙和垃圾袋。','聽說退房時間是10點。']); return; }
  if(ch==='V'){ say(lang==='ja'?['くるま。ここまで にもつを はこんだ。']:['車子。行李都搬到這裡了。']); return; }
  if(ch==='A'){ say(lang==='ja'?['アスファルトの みち。','カーブの むこうは ちゅうしゃじょう。']:['柏油路。','轉彎過去是停車場。']); return; }
  if(ch==='Q'){ say(lang==='ja'?['バーベキューコンロ。','すみの においが しみついてる。']:['烤肉爐。','沾滿了炭火的味道。']); return; }
  if(ch==='w'){ say(lang==='ja'?['あさせ。ひざまでの ふかさ。','ちいさい さかなが スーッと にげていく。','よく みると あちこちに おるで。']
    :['淺灘。深度到膝蓋。','小魚咻地一下逃走了。','仔細看的話到處都有喔。']); return; }
  if(ch==='W'){ say(lang==='ja'?['ここから さきは ふかい。','おおきい さかなの かげが みえた。','これいじょうは いかんとこ。']
    :['再過去就深了。','看到了大魚的影子。','不要再往前了。']); return; }
  if(ch==='k'||ch==='K'){ say(lang==='ja'?['かわの なかの おおきな いわ。','うえに のぼって とびこめそう。']:['河裡的大岩石。','可以爬上去跳水。']); return; }
  if(ch==='G'){ say(lang==='ja'?['かわらの いしが ゴロゴロしてる。','はだしやと ちょっと いたい。']:['河灘上滿是石頭。','光腳走有點痛。']); return; }
  if(ch==='g'){ say(lang==='ja'?['おおきな いわ。','こしかけて かわを ながめる。']:['大岩石。','坐下來眺望河面。']); return; }
  if(ch==='T'){ say(lang==='ja'?['おおきな き。せみのこえが する。']:['大樹。傳來蟬鳴。']); return; }
  if(ch==='M'){ say(lang==='ja'?['たいがんの やまが ぐるっと かこんでる。']:['對岸的群山環繞著這裡。']); return; }
  beep(220,0.04);
}
function pressA(){
  if(!AC) beep(1,0.01);
  if(mode==='lang'){ lang=(langCur===0?'ja':'zh'); nm.cx=0; nm.cy=0; mode='name'; beep(800,0.06); return; }
  if(mode==='name'){ nameSelect(); return; }
  if(mode==='battle'){ btA(); return; }
  if(mode==='ending') return;
  if(noteOpen) return;
  if(dlg.open){
    const page=dlg.pages?dlg.pages[dlg.page]:null;
    const total=page?page.join('').length:0;
    if(!page || dlg.chars<total){ dlg.chars=total; return; }
    if(dlg.page<dlg.pages.length-1){ dlg.page++; dlg.chars=0; beep(700,0.04); }
    else { dlg.open=false; const cb=dlg.onEnd; dlg.onEnd=null; if(cb) cb(); }
    return;
  }
  interact();
}
function pressB(){
  if(mode==='lang') return;
  if(mode==='name'){ heroName=heroName.slice(0,-1); beep(300,0.05); return; }
  if(mode==='battle'||mode==='ending') return;
  if(dlg.open) return;
  noteOpen=!noteOpen; beep(noteOpen?880:440,0.05);
}
function dirInput(k){
  if(mode==='lang'){ if(k==='up'||k==='down'){ langCur=1-langCur; beep(900,0.02);} return; }
  if(mode==='name'){ nameMove(k==='left'?-1:k==='right'?1:0, k==='up'?-1:k==='down'?1:0); return; }
  if(mode==='battle'){ btKey(k); return; }
  if(mode==='ending') return;
  keys[k]=true;
}

/* ===================== INPUT ===================== */
const KMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
  w:'up',s:'down',a:'left',d:'right'};
addEventListener('keydown',e=>{
  const k=KMAP[e.key];
  if(k){ e.preventDefault(); if(!e.repeat||mode==='field') dirInput(k); }
  if(e.key==='z'||e.key==='Z'||e.key==='Enter'||e.key===' '){ pressA(); e.preventDefault(); }
  if(e.key==='x'||e.key==='X'||e.key==='Escape'){ pressB(); e.preventDefault(); }
});
addEventListener('keyup',e=>{ const k=KMAP[e.key]; if(k) keys[k]=false; });
function hold(id,dir){
  const el=document.getElementById(id);
  const on=e=>{ e.preventDefault(); dirInput(dir); };
  const offf=e=>{ e.preventDefault(); keys[dir]=false; };
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',offf,{passive:false});
  el.addEventListener('touchcancel',offf,{passive:false});
  el.addEventListener('mousedown',on); el.addEventListener('mouseup',offf); el.addEventListener('mouseleave',offf);
}
hold('up','up'); hold('down','down'); hold('left','left'); hold('right','right');
function tap(id,fn){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();fn();},{passive:false});
  el.addEventListener('click',e=>{e.preventDefault();fn();});
}
tap('btnA',pressA); tap('btnB',pressB);

/* ===================== LOOP ===================== */
function loop(){
  tick++;
  if(mode==='lang') drawLang();
  else if(mode==='name') drawNameScreen();
  else if(mode==='battle'){ btTick(); drawBattle(); }
  else if(mode==='ending') drawEnding();
  else {
    updateFW(); updateFish();
    if(dlg.open){
      if(!dlg.pages) buildPages();
      const total=(dlg.pages[dlg.page]||[]).join('').length;
      if(dlg.chars<total){ dlg.chars++; if(dlg.chars%3===0) beep(1200,0.012,'square',0.02); }
    } else if(!noteOpen){
      if(!player.moving){
        if(keys.up) tryMove('up'); else if(keys.down) tryMove('down');
        else if(keys.left) tryMove('left'); else if(keys.right) tryMove('right');
        else player.step=0;
      }
      updateMove();
    }
    renderField();
  }
  requestAnimationFrame(loop);
}
resize(); initFish();
if(document.fonts) document.fonts.ready.then(()=>{ dlg.pages=null; bt.lines=null; });
loop();
</script>
